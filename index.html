<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Kentucky tech news, plus KY-AI for artificial intelligence across the Commonwealth." />
    <meta name="theme-color" content="#030805" />
    <meta property="og:title" content="KY-Tech" />
    <meta property="og:description" content="Kentucky tech news and KY-AI." />
    <meta property="og:image" content="./assets/kyai-hero.png" />
    <title>KY-Tech</title>
    <link rel="icon" href="./assets/kyai-mark.svg?v=lanes-20261124" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600;6..72,700&family=Syne:wght@700;800&family=Public+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./home.css?v=cities-20261128" />
  </head>
  <body>
    <canvas id="matrixRain" aria-hidden="true"></canvas>
    <header class="top">
      <a class="logo" href="#tech" data-view="tech">KY-Tech</a>
      <nav class="tabs" aria-label="Main">
        <button type="button" class="nav-btn is-active" data-view="tech" aria-pressed="true">Tech</button>
        <button type="button" class="nav-btn" data-view="ai" aria-pressed="false">KY-AI</button>
        <button type="button" class="nav-btn" data-view="help" aria-pressed="false">Tip</button>
        <button type="button" class="nav-btn" data-view="email" aria-pressed="false">Email</button>
      </nav>
    </header>

    <main>
      <section class="panel is-active" id="feed" aria-label="Feed">
        <div class="toolbar">
          <div class="lane-head">
            <p class="eyebrow" id="laneEyebrow">Live feed</p>
            <h1 id="laneTitle">What’s new</h1>
            <p class="feed-meta" id="feedMeta">Loading…</p>
          </div>
          <div class="filters" aria-label="Place filter">
            <button class="chip is-active" type="button" data-region="all">All</button>
            <button class="chip" type="button" data-region="louisville">Louisville</button>
            <button class="chip" type="button" data-region="bluegrass">Lexington</button>
            <button class="chip" type="button" data-region="bowling-green">Bowling Green</button>
            <button class="chip" type="button" data-region="paducah">Paducah</button>
            <button class="chip" type="button" data-region="covington">Covington</button>
            <button class="chip" type="button" data-region="northern">North</button>
            <button class="chip" type="button" data-region="western">West</button>
            <button class="chip" type="button" data-region="southcentral">South</button>
            <button class="chip" type="button" data-region="appalachia">East</button>
          </div>
        </div>

        <div class="news-list" id="newsList" aria-live="polite">
          <p class="loading">Loading stories…</p>
        </div>
        <button class="more" id="showMore" type="button" hidden>More stories</button>
      </section>

      <section class="panel" id="help" aria-labelledby="help-title" hidden>
        <button type="button" class="back" data-view="tech">← Tech</button>
        <h1 id="help-title">Send a tip</h1>
        <p class="sub">One sentence is enough. Where it happened helps.</p>
        <form id="tipForm">
          <label>
            What happened?
            <textarea name="what" rows="4" maxlength="400" required placeholder="Library AI class in Paducah…"></textarea>
          </label>
          <label>
            Where?
            <input name="where" maxlength="120" required placeholder="City or county" />
          </label>
          <label>
            Lane
            <select name="lane">
              <option value="tech">Tech</option>
              <option value="ai" selected>KY-AI</option>
            </select>
          </label>
          <label>
            Link <span class="optional">optional</span>
            <input name="link" type="url" placeholder="https://" />
          </label>
          <button class="btn" type="submit">Send</button>
          <p class="status" id="tipStatus" role="status"></p>
        </form>
      </section>

      <section class="panel" id="email" aria-labelledby="email-title" hidden>
        <button type="button" class="back" data-view="tech">← Tech</button>
        <h1 id="email-title">Get the weekly note</h1>
        <p class="sub">One short email. Easy to leave.</p>
        <form id="emailForm">
          <label>
            Email
            <input name="email" type="email" autocomplete="email" required placeholder="you@example.com" />
          </label>
          <button class="btn" type="submit">Sign up</button>
          <p class="status" id="emailStatus" role="status"></p>
        </form>
      </section>
    </main>

    <footer class="foot">
      <a href="https://github.com/Kgarmon99/kyai-com">Source</a>
      <a href="./review.html">Editors</a>
    </footer>

    <script src="./app.js?v=newest-fix-20261128"></script>
  </body>
</html>
