name: Add or claim a profile
description: Suggest or correct a Kentucky AI person, organization, program, host, or meetup.
title: "[Profile]: "
labels: ["profile", "needs review"]
body:
  - type: input
    id: name
    attributes:
      label: Name
    validations:
      required: true
  - type: dropdown
    id: type
    attributes:
      label: Type
      options:
        - Person
        - Company
        - University / school
        - Library / civic host
        - Chamber / economic development
        - Meetup / community
        - Government / policy
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Public source URL
      placeholder: https://...
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Why this belongs on KYAI
    validations:
      required: true

